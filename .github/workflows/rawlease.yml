name: RAWCLK shared sound ownership
on:
  pull_request:
  push:
    branches: [main, feature/unified-sound-setup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rawlease:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Confirm exact reviewed head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Exercise both actual RAWCLK variants
        run: python3 libtandywin/AUDIO/HOST/RUNRAW.PY --out "$RUNNER_TEMP/rawlease"
      - name: Verify focused source receipt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          receipt=json.loads(Path('libtandywin/AUDIO/TESTS/RAWLEASE.JSON').read_bytes())
          for name,wanted in receipt['source_sha256'].items():
              path=Path(name.replace('\\','/'))
              assert hashlib.sha256(path.read_bytes()).hexdigest()==wanted, name
          assert all(row['passed'] for row in receipt['results'])
          print('PASS shared sound ownership source receipt')
          PY
